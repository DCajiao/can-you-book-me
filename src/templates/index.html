<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Can You Book Me?</title>
  <meta name="description" content="Disponibilidad en tiempo real. Agenda un momento conmigo.">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2357c4">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BookMe">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg">

  <!-- Open Graph -->
  <meta property="og:title" content="Can You Book Me?">
  <meta property="og:description" content="Disponibilidad en tiempo real. Agenda un momento conmigo.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/static/icons/og-image.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Can You Book Me?">
  <meta name="twitter:description" content="Disponibilidad en tiempo real. Agenda un momento conmigo.">
  <meta name="twitter:image" content="/static/icons/og-image.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <div class="bg-texture" aria-hidden="true"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-logo">
      <svg class="logo-glyph" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="30" height="30" rx="7" stroke="currentColor" stroke-width="1.5"/>
        <rect x="8" y="8" width="16" height="16" rx="3" fill="currentColor" opacity="0.15"/>
        <path d="M8 14h16M8 19h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="11" cy="11" r="1.5" fill="currentColor"/>
        <circle cx="21" cy="11" r="1.5" fill="currentColor"/>
      </svg>
      <div class="logo-text-wrap">
        <span class="logo-main">Can You</span>
        <span class="logo-accent">Book Me?</span>
      </div>
    </div>

    <div class="header-actions">
      <div class="tz-badge" id="tz-badge">
        <span class="tz-dot" aria-hidden="true"></span>
        <span class="tz-label">Tu zona</span>
        <span class="tz-value mono" id="user-tz">—</span>
      </div>
    </div>
  </header>

  <!-- Calendar -->
  <main class="main-content">
    <div class="calendar-shell">
      <div id="calendar"></div>
    </div>
  </main>

  <!-- Event Detail Modal -->
  <div id="event-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-card" id="modal-card">
      <div class="modal-color-bar" id="modal-color-bar"></div>
      <div class="modal-drag-handle" aria-hidden="true"></div>

      <div class="modal-head">
        <div class="modal-meta">
          <span class="modal-cal-tag" id="modal-calendar"></span>
          <h2 class="modal-title" id="modal-title"></h2>
        </div>
        <button class="modal-close-btn" id="modal-close" aria-label="Cerrar">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M1 1L13 13M13 1L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="detail-item" id="detail-time">
          <span class="detail-key">Hora</span>
          <span class="detail-val mono" id="modal-time"></span>
        </div>
        <div class="detail-item hidden" id="detail-tz">
          <span class="detail-key">
            <span class="tz-globe">🌍</span> Zona original
          </span>
          <span class="detail-val mono" id="modal-tz"></span>
        </div>
        <div class="detail-item hidden" id="detail-location">
          <span class="detail-key">Lugar</span>
          <span class="detail-val" id="modal-location"></span>
        </div>
        <div class="detail-item hidden" id="detail-desc">
          <span class="detail-key">Nota</span>
          <span class="detail-val" id="modal-desc"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
