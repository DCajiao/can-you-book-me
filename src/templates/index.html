<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Can You Book Me? — DCajiao</title>
  <meta name="description" content="Agenda un momento con DCajiao. Disponibilidad en tiempo real.">
  <meta name="author" content="DCajiao">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2357c4">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BookMe · DCajiao">
  <link rel="apple-touch-icon" href="/static/icons/download.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/static/icons/download.png">

  <!-- Open Graph -->
  <meta property="og:title" content="Can You Book Me? — DCajiao">
  <meta property="og:description" content="Agenda un momento con DCajiao. Disponibilidad en tiempo real.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/static/icons/download.png">
  <meta property="og:image:alt" content="DCajiao — Can You Book Me?">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Can You Book Me? — DCajiao">
  <meta name="twitter:description" content="Agenda un momento con DCajiao. Disponibilidad en tiempo real.">
  <meta name="twitter:image" content="/static/icons/download.png">
  <meta name="twitter:image:alt" content="DCajiao — Can You Book Me?">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <div class="bg-texture" aria-hidden="true"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-logo">
      <img class="logo-avatar" src="/static/icons/download.png" alt="DCajiao avatar" width="40" height="40">
      <div class="logo-text-wrap">
        <span class="logo-main">Can You Book Me?</span>
        <span class="logo-sub">DCajiao</span>
      </div>
    </div>

    <div class="header-actions">
      <button class="install-btn hidden" id="install-btn" aria-label="Instalar app">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 1v9M4.5 6.5L8 10l3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>Instalar</span>
      </button>

      <div class="tz-badge" id="tz-badge">
        <span class="tz-dot" aria-hidden="true"></span>
        <span class="tz-label">Tu zona</span>
        <span class="tz-value mono" id="user-tz">—</span>
      </div>
    </div>
  </header>

  <!-- iOS install instructions tooltip -->
  <div id="ios-install-tip" class="ios-tip hidden" role="dialog" aria-modal="true" aria-label="Cómo instalar">
    <div class="ios-tip-arrow"></div>
    <button class="ios-tip-close" id="ios-tip-close" aria-label="Cerrar">✕</button>
    <p class="ios-tip-title">Instala la app</p>
    <ol class="ios-tip-steps">
      <li>Toca <strong>Compartir</strong>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="vertical-align:middle;margin:0 2px"><path d="M8 1v8M4.5 4.5L8 1l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 9v5h10V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        en Safari
      </li>
      <li>Selecciona <strong>"Agregar a pantalla de inicio"</strong></li>
    </ol>
  </div>

  <!-- Calendar -->
  <main class="main-content">
    <div class="calendar-shell">
      <div id="calendar"></div>
    </div>
  </main>

  <!-- Event Detail Modal -->
  <div id="event-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-card" id="modal-card">
      <div class="modal-color-bar" id="modal-color-bar"></div>
      <div class="modal-drag-handle" aria-hidden="true"></div>

      <div class="modal-head">
        <div class="modal-meta">
          <span class="modal-cal-tag" id="modal-calendar"></span>
          <h2 class="modal-title" id="modal-title"></h2>
        </div>
        <button class="modal-close-btn" id="modal-close" aria-label="Cerrar">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M1 1L13 13M13 1L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="detail-item" id="detail-time">
          <span class="detail-key">Hora</span>
          <span class="detail-val mono" id="modal-time"></span>
        </div>
        <div class="detail-item hidden" id="detail-tz">
          <span class="detail-key">
            <span class="tz-globe">🌍</span> Zona original
          </span>
          <span class="detail-val mono" id="modal-tz"></span>
        </div>
        <div class="detail-item hidden" id="detail-location">
          <span class="detail-key">Lugar</span>
          <span class="detail-val" id="modal-location"></span>
        </div>
        <div class="detail-item hidden" id="detail-desc">
          <span class="detail-key">Nota</span>
          <span class="detail-val" id="modal-desc"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
